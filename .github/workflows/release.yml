name: Create a release
on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pluginadmin dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: Get experimental info
        id: get-experimental
        run: |
          python - <<'EOF' >> "${GITHUB_OUTPUT}"
          import tomllib
          with open("pyproject.toml", "rb") as fh:
              data = tomllib.load(fh)
          experimental = data["tool"]["qgis-plugin"]["metadata"]["experimental"].lower()
          print(f"IS_EXPERIMENTAL={experimental}")
          EOF

      - name: create release from tag
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          prerelease: ${{ steps.get-experimental.outputs.IS_EXPERIMENTAL }}
          draft: false

      - name: generate zip
        run: python pluginadmin.py generate-zip

      - name: get zip details
        id: get-zip-details
        run: |
          {
            echo "ZIP_PATH=dist/$(ls dist)"
            echo "ZIP_NAME=$(ls dist)"
          } >> "${GITHUB_OUTPUT}"

      - name: upload release asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url}}
          asset_path: ${{ steps.get-zip-details.outputs.ZIP_PATH}}
          asset_name: ${{ steps.get-zip-details.outputs.ZIP_NAME}}
          asset_content_type: application/zip

  update-docs:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pluginadmin dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev

      - name: generate plugin repo XML
        run: python pluginadmin.py --verbose generate-plugin-repo-xml

      - name: update docs
        run: mkdocs gh-deploy --force
